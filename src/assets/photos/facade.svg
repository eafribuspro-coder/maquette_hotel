<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c8de"/><stop offset="1" stop-color="#dce9f0"/>
    </linearGradient>
    <linearGradient id="cour" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc4b2"/><stop offset="1" stop-color="#e6ddcb"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="850" fill="url(#cielF)"/>
  <!-- bâtiment principal rose -->
  <polygon points="180,205 1180,175 1230,215 1230,540 180,540" fill="#efa8a0"/>
  <polygon points="150,215 1200,180 1230,215 180,245" fill="#f2ede2"/>
  <!-- bandeau brun de l'étage -->
  <rect x="240" y="255" width="900" height="70" fill="#4c3a2e"/>
  <rect x="1140" y="200" width="90" height="340" fill="#4c3a2e"/>
  <!-- portes et fenêtres avec auvents -->
  <g>
    <g fill="#2f2b28">
      <rect x="300" y="390" width="55" height="150"/>
      <rect x="450" y="390" width="55" height="150"/>
      <rect x="600" y="390" width="55" height="150"/>
      <rect x="750" y="390" width="55" height="150" fill="#7a2c2c"/>
      <rect x="900" y="390" width="55" height="150"/>
      <rect x="1050" y="390" width="55" height="150"/>
    </g>
    <g fill="#3d2f26">
      <polygon points="285,385 370,385 355,360 300,360"/>
      <polygon points="435,385 520,385 505,360 450,360"/>
      <polygon points="585,385 670,385 655,360 600,360"/>
      <polygon points="735,385 820,385 805,360 750,360"/>
      <polygon points="885,385 970,385 955,360 900,360"/>
      <polygon points="1035,385 1120,385 1105,360 1050,360"/>
    </g>
  </g>
  <!-- palmiers d'ornement le long de la façade -->
  <g fill="#5f8a4e">
    <ellipse cx="330" cy="510" rx="45" ry="28"/>
    <ellipse cx="480" cy="512" rx="45" ry="28"/>
    <ellipse cx="630" cy="514" rx="45" ry="28"/>
    <ellipse cx="780" cy="514" rx="45" ry="28"/>
    <ellipse cx="930" cy="512" rx="45" ry="28"/>
    <ellipse cx="1080" cy="510" rx="45" ry="28"/>
  </g>
  <!-- cour : gravier + allée -->
  <rect x="0" y="540" width="1280" height="310" fill="url(#cour)"/>
  <polygon points="80,540 560,540 900,850 0,850" fill="#c9bda6"/>
  <polygon points="620,540 1280,600 1280,850 900,850" fill="#ded4c0"/>
  <!-- filaos élancés devant -->
  <g>
    <rect x="200" y="60" width="14" height="500" fill="#6b5744"/>
    <rect x="320" y="30" width="14" height="530" fill="#6b5744"/>
    <rect x="440" y="70" width="14" height="490" fill="#6b5744"/>
    <rect x="560" y="45" width="14" height="515" fill="#6b5744"/>
    <g fill="#41603b" opacity="0.9">
      <ellipse cx="207" cy="90" rx="70" ry="110"/>
      <ellipse cx="327" cy="60" rx="80" ry="120"/>
      <ellipse cx="447" cy="100" rx="72" ry="105"/>
      <ellipse cx="567" cy="75" rx="78" ry="115"/>
    </g>
  </g>
</svg>
