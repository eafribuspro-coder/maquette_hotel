    <linearGradient id="sable2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfa878"/><stop offset="1" stop-color="#e3c9a0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="850" fill="url(#ciel2)"/>
  <!-- longue toiture terracotta -->
  <polygon points="0,150 300,90 700,130 1050,100 1280,140 1280,240 0,250" fill="#b8663a"/>
  <polygon points="0,150 300,90 700,130 1050,100 1280,140 1280,180 0,195" fill="#c96f3b"/>
