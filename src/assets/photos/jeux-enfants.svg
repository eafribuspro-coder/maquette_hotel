<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd6e6"/><stop offset="1" stop-color="#e8f1f4"/>
    </linearGradient>
    <linearGradient id="eauJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc9d1"/><stop offset="1" stop-color="#2e9ba6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="850" fill="url(#cielJ)"/>
  <!-- palmiers -->
  <g fill="#5c7a54" opacity="0.9">
    <ellipse cx="150" cy="140" rx="66" ry="25"/><rect x="146" y="148" width="8" height="95"/>
    <ellipse cx="1130" cy="110" rx="70" ry="26"/><rect x="1126" y="118" width="8" height="110"/>
  </g>
  <!-- mur rose du fond -->
  <rect x="0" y="250" width="1280" height="140" fill="#efa8a0"/>
  <!-- structure de jeux -->
  <g>
    <!-- plateforme -->
    <rect x="470" y="270" width="340" height="30" rx="8" fill="#c96f3b"/>
    <rect x="490" y="300" width="18" height="180" fill="#a85527"/>
    <rect x="770" y="300" width="18" height="180" fill="#a85527"/>
    <!-- toit -->
    <polygon points="450,270 640,190 830,270" fill="#de7a6e"/>
    <!-- toboggan jaune -->
    <path d="M500 300 C 420 380 360 420 300 470 L 340 500 C 410 450 470 400 545 320 Z" fill="#f2c94c"/>
    <!-- toboggan turquoise -->
    <path d="M780 300 C 860 380 920 420 980 470 L 940 500 C 870 450 810 400 735 320 Z" fill="#2e9ba6"/>
    <!-- seau verseur -->
    <rect x="620" y="210" width="44" height="34" rx="6" fill="#e05c5c"/>
  </g>
  <!-- bassin enfants -->
  <ellipse cx="640" cy="600" rx="560" ry="180" fill="url(#eauJ)"/>
  <ellipse cx="640" cy="600" rx="560" ry="180" fill="none" stroke="#e9e2d2" stroke-width="18"/>
  <!-- éclaboussures -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="420" cy="560" r="12"/><circle cx="460" cy="590" r="8"/>
    <circle cx="860" cy="570" r="12"/><circle cx="820" cy="600" r="8"/>
    <circle cx="640" cy="530" r="10"/>
  </g>
  <!-- bouées colorées -->
  <circle cx="380" cy="640" r="34" fill="#f2c94c"/><circle cx="380" cy="640" r="16" fill="#7cc9d1"/>
  <circle cx="900" cy="650" r="34" fill="#e05c5c"/><circle cx="900" cy="650" r="16" fill="#e8f1f4"/>
  <!-- plage carrelée -->
  <rect x="0" y="760" width="1280" height="90" fill="#e9e2d2"/>
</svg>
