<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielP1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0ea"/><stop offset="1" stop-color="#e8eff2"/>
    </linearGradient>
    <linearGradient id="eau1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e7480"/><stop offset="0.5" stop-color="#2e9ba6"/><stop offset="1" stop-color="#7cc9d1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="850" fill="url(#cielP1)"/>
  <!-- palmiers lointains -->
  <g fill="#5c7a54" opacity="0.85">
    <ellipse cx="820" cy="160" rx="60" ry="22"/><rect x="815" y="165" width="8" height="70"/>
    <ellipse cx="960" cy="130" rx="65" ry="24"/><rect x="955" y="138" width="8" height="90"/>
    <ellipse cx="1120" cy="150" rx="58" ry="22"/><rect x="1116" y="158" width="8" height="75"/>
  </g>
  <!-- mur bois + mur rose -->
  <rect x="0" y="230" width="560" height="180" fill="#9a6b4f"/>
  <rect x="0" y="230" width="560" height="180" fill="#7c523a" opacity="0.4"/>
  <rect x="560" y="240" width="720" height="180" fill="#efa8a0"/>
  <!-- paillote de droite -->
  <polygon points="880,230 1280,215 1280,300 880,300" fill="#f2ede2"/>
  <rect x="900" y="300" width="360" height="110" fill="#e8968c"/>
  <!-- parasols -->
  <g>
    <polygon points="120,270 260,270 190,320" fill="#b9bda4"/>
    <polygon points="300,275 440,275 370,325" fill="#b9bda4"/>
    <rect x="187" y="300" width="6" height="90" fill="#6b6b6b"/>
    <rect x="367" y="305" width="6" height="85" fill="#6b6b6b"/>
  </g>
  <!-- transats -->
  <g fill="#f5f2ea">
    <rect x="110" y="380" width="90" height="16" rx="6"/>
    <rect x="220" y="382" width="90" height="16" rx="6"/>
    <rect x="330" y="384" width="90" height="16" rx="6"/>
  </g>
  <!-- plage de la piscine -->
  <rect x="0" y="410" width="1280" height="440" fill="#e9e2d2"/>
  <!-- bassin -->
  <polygon points="140,460 1060,445 1280,760 40,820" fill="url(#eau1)"/>
  <!-- reflets carrelage -->
  <g stroke="#175a64" stroke-width="2" opacity="0.25">
    <line x1="220" y1="480" x2="140" y2="780"/>
    <line x1="420" y1="472" x2="380" y2="790"/>
    <line x1="620" y1="465" x2="640" y2="795"/>
    <line x1="820" y1="458" x2="900" y2="790"/>
    <line x1="1000" y1="450" x2="1140" y2="775"/>
  </g>
  <!-- margelle mosaïque -->
  <polygon points="1060,445 1280,760 1280,850 1180,850" fill="#d8cdb9"/>
</svg>
